<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">HK Baoshun Trade Limited — BAOSHUN logotype</title>
  <defs>
    <linearGradient id="bmGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C69D4"/>
      <stop offset="1" stop-color="#0B0B10"/>
    </linearGradient>
  </defs>
  <!-- Emblem group -->
  <g transform="translate(8 8)">
    <circle cx="24" cy="24" r="23" fill="#0B0B10"/>
    <circle cx="24" cy="24" r="22" fill="none" stroke="#C9A24B" stroke-width="1"/>
    <!-- Globe meridians -->
    <ellipse cx="24" cy="24" rx="20" ry="20" fill="none" stroke="#1C69D4" stroke-width="1.2" opacity="0.9"/>
    <ellipse cx="24" cy="24" rx="9" ry="20" fill="none" stroke="#1C69D4" stroke-width="1" opacity="0.7"/>
    <line x1="4" y1="24" x2="44" y2="24" stroke="#1C69D4" stroke-width="1" opacity="0.7"/>
    <line x1="24" y1="4" x2="24" y2="44" stroke="#1C69D4" stroke-width="1" opacity="0.7"/>
    <path d="M6 18 Q24 26 42 18" fill="none" stroke="#1C69D4" stroke-width="0.8" opacity="0.5"/>
    <path d="M6 30 Q24 22 42 30" fill="none" stroke="#1C69D4" stroke-width="0.8" opacity="0.5"/>
    <!-- Stylized B -->
    <path d="M17 12 L17 36 L26 36 Q32 36 32 30 Q32 26 28 24 Q31 22 31 18 Q31 12 25 12 Z M21 16 L25 16 Q27 16 27 18.5 Q27 21 25 21 L21 21 Z M21 25 L26 25 Q28 25 28 28.5 Q28 32 26 32 L21 32 Z" fill="#C9A24B"/>
    <!-- Gold arc accent -->
    <path d="M44 24 A20 20 0 0 1 24 44" fill="none" stroke="#C9A24B" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <!-- Wordmark -->
  <g transform="translate(72 0)" fill="#0B0B10">
    <text x="0" y="34" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="22" letter-spacing="3.2" fill="#0B0B10">BAOSHUN</text>
    <text x="1" y="50" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="8" letter-spacing="2.4" fill="#1C69D4">HK BAOSHUN TRADE LIMITED</text>
    <line x1="0" y1="40" x2="180" y2="40" stroke="#C9A24B" stroke-width="0.8" opacity="0.6"/>
  </g>
