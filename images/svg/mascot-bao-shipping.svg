  <path d="M110 130 Q104 136 100 132" fill="none" stroke="#0B0B10" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M110 130 Q116 136 120 132" fill="none" stroke="#0B0B10" stroke-width="1.6" stroke-linecap="round"/>
