  <g transform="translate(70 178)">
    <rect x="0" y="0" width="34" height="40" rx="2" fill="#FFFFFF" stroke="#0B0B10" stroke-width="1.4"/>
    <rect x="11" y="-3" width="12" height="6" rx="1" fill="#0B0B10"/>
    <line x1="5" y1="10" x2="29" y2="10" stroke="#1C69D4" stroke-width="1.2"/>
    <line x1="5" y1="16" x2="29" y2="16" stroke="#0B0B10" stroke-width="0.8" opacity="0.5"/>
    <line x1="5" y1="21" x2="29" y2="21" stroke="#0B0B10" stroke-width="0.8" opacity="0.5"/>
    <line x1="5" y1="26" x2="22" y2="26" stroke="#0B0B10" stroke-width="0.8" opacity="0.5"/>
    <polyline points="22,30 25,33 30,28" fill="none" stroke="#6FB07F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Head -->
  <ellipse cx="110" cy="98" rx="56" ry="54" fill="#8B5E3C"/>
  <!-- Ears -->
  <circle cx="68" cy="58" r="11" fill="#8B5E3C"/>
  <circle cx="68" cy="58" r="6" fill="#F4E4C1"/>
  <circle cx="152" cy="58" r="11" fill="#8B5E3C"/>
  <circle cx="152" cy="58" r="6" fill="#F4E4C1"/>
