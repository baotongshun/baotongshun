  <ellipse cx="128" cy="100" rx="6" ry="8" fill="#0B0B10"/>
  <circle cx="94" cy="97" r="2" fill="#FFFFFF"/>
  <circle cx="130" cy="97" r="2" fill="#FFFFFF"/>
  <!-- Cheek blush -->
  <ellipse cx="78" cy="120" rx="6" ry="3" fill="#FF6F00" opacity="0.18"/>
  <ellipse cx="142" cy="120" rx="6" ry="3" fill="#FF6F00" opacity="0.18"/>
