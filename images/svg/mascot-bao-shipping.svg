  <rect x="68" y="42" width="84" height="6" fill="#C9A24B"/>
  <circle cx="110" cy="28" r="8" fill="#C9A24B"/>
  <path d="M110 22 L112 27 L117 27 L113 30 L115 35 L110 32 L105 35 L107 30 L103 27 L108 27 Z" fill="#0B0B10"/>
