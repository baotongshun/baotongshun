<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="baoShipTitle">
  <title id="baoShipTitle">Bao the otter shipping — captain mode</title>
  <!-- Background -->
  <rect width="240" height="240" fill="#FFFFFF"/>
  <!-- Floor shadow -->
