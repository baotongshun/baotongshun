  <g transform="translate(168 158)">
    <rect x="0" y="6" width="58" height="40" fill="#1C69D4"/>
    <rect x="0" y="6" width="58" height="40" fill="none" stroke="#0B0B10" stroke-width="1.4"/>
    <line x1="14" y1="6" x2="14" y2="46" stroke="#0B0B10" stroke-width="0.8" opacity="0.5"/>
    <line x1="28" y1="6" x2="28" y2="46" stroke="#0B0B10" stroke-width="0.8" opacity="0.5"/>
    <line x1="44" y1="6" x2="44" y2="46" stroke="#0B0B10" stroke-width="0.8" opacity="0.5"/>
    <text x="29" y="30" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">BAO</text>
    <rect x="0" y="2" width="58" height="6" fill="#0B0B10" opacity="0.4"/>
  </g>
  <!-- Body -->
  <path d="M64 200 Q64 144 110 138 Q156 144 156 200 Q156 210 146 212 L74 212 Q64 210 64 200 Z" fill="#8B5E3C"/>
  <!-- Belly -->
