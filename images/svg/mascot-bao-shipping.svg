  <line x1="90" y1="122" x2="70" y2="120" stroke="#5C3A20" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="90" y1="126" x2="70" y2="128" stroke="#5C3A20" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="130" y1="122" x2="150" y2="120" stroke="#5C3A20" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="130" y1="126" x2="150" y2="128" stroke="#5C3A20" stroke-width="0.9" stroke-linecap="round"/>
