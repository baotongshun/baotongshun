<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="baoWaveTitle">
  <title id="baoWaveTitle">Bao the otter waving hello</title>
  <defs>
    <linearGradient id="scarfG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9A24B"/>
      <stop offset="1" stop-color="#A07E2E"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="240" height="240" fill="#FFFFFF"/>
  <!-- Shadow -->
  <ellipse cx="120" cy="218" rx="58" ry="6" fill="#0B0B10" opacity="0.08"/>
  <!-- Body -->
  <path d="M70 200 Q70 145 120 140 Q170 145 170 200 Q170 210 160 212 L80 212 Q70 210 70 200 Z" fill="#8B5E3C"/>
  <!-- Belly -->
  <path d="M90 200 Q90 158 120 156 Q150 158 150 200 Q150 208 142 210 L98 210 Q90 208 90 200 Z" fill="#F4E4C1"/>
  <!-- Scarf -->
  <path d="M82 142 Q120 132 158 142 L162 154 Q120 146 78 154 Z" fill="url(#scarfG)"/>
  <path d="M150 150 L165 200 L155 202 L142 154 Z" fill="url(#scarfG)"/>
  <path d="M148 200 L168 196 L165 204 L150 206 Z" fill="#A07E2E"/>
  <!-- Right arm (down) -->
  <path d="M158 162 Q176 168 178 188 Q176 196 168 196 Q160 188 156 178 Z" fill="#8B5E3C"/>
  <circle cx="172" cy="192" r="9" fill="#F4E4C1"/>
  <circle cx="170" cy="191" r="1.4" fill="#5C3A20"/>
  <circle cx="174" cy="191" r="1.4" fill="#5C3A20"/>
  <circle cx="172" cy="194" r="1.4" fill="#5C3A20"/>
  <!-- Left arm (waving up) -->
  <path d="M82 158 Q66 130 64 100 Q66 88 76 88 Q86 92 88 110 L92 140 Z" fill="#8B5E3C"/>
  <ellipse cx="72" cy="84" rx="14" ry="16" fill="#8B5E3C"/>
  <ellipse cx="72" cy="86" rx="9" ry="11" fill="#F4E4C1"/>
  <circle cx="69" cy="82" r="1.3" fill="#5C3A20"/>
  <circle cx="75" cy="82" r="1.3" fill="#5C3A20"/>
  <circle cx="72" cy="86" r="1.3" fill="#5C3A20"/>
  <!-- Head -->
  <ellipse cx="120" cy="98" rx="58" ry="56" fill="#8B5E3C"/>
  <!-- Ears -->
  <circle cx="76" cy="56" r="11" fill="#8B5E3C"/>
  <circle cx="76" cy="56" r="6" fill="#F4E4C1"/>
  <circle cx="164" cy="56" r="11" fill="#8B5E3C"/>
  <circle cx="164" cy="56" r="6" fill="#F4E4C1"/>
  <!-- Face mask -->
  <ellipse cx="120" cy="108" rx="40" ry="36" fill="#F4E4C1"/>
  <!-- Eyes -->
  <ellipse cx="100" cy="98" rx="6" ry="8" fill="#0B0B10"/>
  <ellipse cx="140" cy="98" rx="6" ry="8" fill="#0B0B10"/>
  <circle cx="102" cy="95" r="2" fill="#FFFFFF"/>
  <circle cx="142" cy="95" r="2" fill="#FFFFFF"/>
  <!-- Cheek blush -->
  <ellipse cx="86" cy="118" rx="6" ry="3" fill="#FF6F00" opacity="0.18"/>
  <ellipse cx="154" cy="118" rx="6" ry="3" fill="#FF6F00" opacity="0.18"/>
  <!-- Nose -->
  <path d="M114 116 Q120 110 126 116 Q124 122 120 122 Q116 122 114 116 Z" fill="#0B0B10"/>
  <!-- Mouth -->
  <path d="M120 122 L120 128" stroke="#0B0B10" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M120 128 Q114 134 110 130" fill="none" stroke="#0B0B10" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M120 128 Q126 134 130 130" fill="none" stroke="#0B0B10" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Whiskers -->
  <line x1="98" y1="120" x2="78" y2="118" stroke="#5C3A20" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="98" y1="124" x2="78" y2="126" stroke="#5C3A20" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="142" y1="120" x2="162" y2="118" stroke="#5C3A20" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="142" y1="124" x2="162" y2="126" stroke="#5C3A20" stroke-width="0.9" stroke-linecap="round"/>
  <!-- Waving motion lines -->
  <path d="M52 70 Q44 76 50 84" fill="none" stroke="#1C69D4" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M46 60 Q38 70 46 80" fill="none" stroke="#1C69D4" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <!-- Scarf knot highlight -->
  <path d="M120 138 L124 146 L116 146 Z" fill="#A07E2E" opacity="0.6"/>
</svg>
