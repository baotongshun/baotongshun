<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="newsTitle">
  <title id="newsTitle">News illustration — isometric office desk</title>
  <defs>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6F5F1"/>
      <stop offset="1" stop-color="#E8E5DC"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#floorGrad)"/>
  <!-- Wall divider -->
  <line x1="0" y1="280" x2="800" y2="280" stroke="#0B0B10" stroke-width="0.6" opacity="0.15"/>
  <!-- Wall art (frame) -->
  <g transform="translate(120 100)">
    <rect x="0" y="0" width="100" height="70" fill="#FFFFFF" stroke="#0B0B10" stroke-width="1.4"/>
    <rect x="6" y="6" width="88" height="58" fill="#1C69D4" opacity="0.15"/>
    <ellipse cx="50" cy="40" rx="20" ry="14" fill="none" stroke="#1C69D4" stroke-width="1"/>
    <line x1="30" y1="40" x2="70" y2="40" stroke="#1C69D4" stroke-width="0.8"/>
    <line x1="50" y1="26" x2="50" y2="54" stroke="#1C69D4" stroke-width="0.8"/>
  </g>
  <!-- Window -->
  <g transform="translate(560 80)">
    <rect x="0" y="0" width="160" height="120" fill="#FFFFFF" stroke="#0B0B10" stroke-width="1.4"/>
    <line x1="80" y1="0" x2="80" y2="120" stroke="#0B0B10" stroke-width="1.2"/>
    <line x1="0" y1="60" x2="160" y2="60" stroke="#0B0B10" stroke-width="1.2"/>
    <rect x="0" y="0" width="160" height="120" fill="#1C69D4" opacity="0.15"/>
    <circle cx="40" cy="100" r="14" fill="#C9A24B" opacity="0.6"/>
    <line x1="0" y1="100" x2="160" y2="100" stroke="#0B0B10" stroke-width="0.5" opacity="0.4"/>
  </g>
  <!-- Desk top (isometric) -->
  <g transform="translate(140 280)">
    <!-- Top surface -->
    <polygon points="0,0 460,0 540,80 80,80" fill="#8B5E3C"/>
    <polygon points="0,0 460,0 540,80 80,80" fill="none" stroke="#0B0B10" stroke-width="1.2"/>
    <!-- Front face -->
    <polygon points="80,80 540,80 540,100 80,100" fill="#5C3A20"/>
    <polygon points="80,80 540,80 540,100 80,100" fill="none" stroke="#0B0B10" stroke-width="1.2"/>
    <!-- Right face -->
    <polygon points="540,80 540,100 460,20 460,0" fill="#5C3A20" opacity="0.7"/>
    <line x1="540" y1="80" x2="540" y2="100" stroke="#0B0B10" stroke-width="1.2"/>
    <!-- Wood grain hints -->
    <line x1="40" y1="14" x2="500" y2="14" stroke="#5C3A20" stroke-width="0.5" opacity="0.3"/>
    <line x1="60" y1="36" x2="520" y2="36" stroke="#5C3A20" stroke-width="0.5" opacity="0.3"/>
    <line x1="80" y1="58" x2="540" y2="58" stroke="#5C3A20" stroke-width="0.5" opacity="0.3"/>
  </g>
  <!-- Desk legs -->
  <g fill="#5C3A20" stroke="#0B0B10" stroke-width="1.2">
    <polygon points="140,380 156,380 156,460 140,460"/>
    <polygon points="600,380 616,380 616,460 600,460"/>
    <polygon points="140,380 156,380 156,460 140,460" fill="none"/>
  </g>
  <!-- Laptop on desk (isometric) -->
  <g transform="translate(220 270)">
    <!-- Base -->
    <polygon points="0,30 200,30 230,60 30,60" fill="#C9CDD3" stroke="#0B0B10" stroke-width="1.2"/>
    <polygon points="0,30 200,30 230,60 30,60" fill="#0B0B10" opacity="0.08"/>
    <!-- Keyboard -->
    <polygon points="20,38 180,38 200,52 40,52" fill="#0B0B10" opacity="0.7"/>
    <line x1="40" y1="44" x2="180" y2="44" stroke="#FFFFFF" stroke-width="0.4" opacity="0.4"/>
    <line x1="44" y1="48" x2="180" y2="48" stroke="#FFFFFF" stroke-width="0.4" opacity="0.4"/>
    <!-- Screen -->
    <polygon points="20,-50 200,-50 230,30 30,30" fill="#0B0B10" stroke="#0B0B10" stroke-width="1.2"/>
    <polygon points="30,-44 192,-44 218,24 40,24" fill="#1C69D4"/>
    <!-- Screen content -->
    <rect x="40" y="-40" width="80" height="6" fill="#FFFFFF" opacity="0.7"/>
    <rect x="40" y="-28" width="60" height="3" fill="#FFFFFF" opacity="0.5"/>
    <rect x="40" y="-20" width="50" height="3" fill="#FFFFFF" opacity="0.5"/>
    <rect x="40" y="-12" width="70" height="3" fill="#FFFFFF" opacity="0.5"/>
    <rect x="40" y="-4" width="40" height="3" fill="#C9A24B"/>
    <!-- Apple-like logo dot -->
    <circle cx="115" cy="-25" r="4" fill="#FFFFFF" opacity="0.6"/>
  </g>
  <!-- Coffee mug -->
  <g transform="translate(490 240)">
    <polygon points="0,20 40,20 48,30 8,30" fill="#FFFFFF" stroke="#0B0B10" stroke-width="1"/>
    <ellipse cx="24" cy="20" rx="24" ry="4" fill="#5C3A20"/>
    <ellipse cx="24" cy="20" rx="20" ry="3" fill="#3A2412"/>
    <path d="M40 22 Q52 22 52 30 Q52 38 40 38" fill="none" stroke="#0B0B10" stroke-width="1"/>
    <line x1="0" y1="20" x2="40" y2="20" stroke="#C9A24B" stroke-width="2"/>
    <path d="M16 12 Q14 8 16 4 M24 12 Q22 8 24 4 M32 12 Q30 8 32 4" fill="none" stroke="#1C69D4" stroke-width="1" opacity="0.5"/>
  </g>
  <!-- Plant pot -->
  <g transform="translate(110 250)">
    <polygon points="0,40 50,40 44,80 6,80" fill="#C9A24B" stroke="#0B0B10" stroke-width="1.2"/>
    <line x1="0" y1="40" x2="50" y2="40" stroke="#0B0B10" stroke-width="1.2"/>
    <line x1="6" y1="50" x2="44" y2="50" stroke="#A07E2E" stroke-width="0.8" opacity="0.6"/>
    <ellipse cx="25" cy="40" rx="25" ry="4" fill="#5C3A20"/>
    <!-- Plant leaves -->
    <path d="M25 40 Q10 10 5 -20 Q15 -10 25 0" fill="#6FB07F" stroke="#0B0B10" stroke-width="0.8"/>
    <path d="M25 40 Q40 10 45 -20 Q35 -10 25 0" fill="#6FB07F" stroke="#0B0B10" stroke-width="0.8"/>
    <path d="M25 40 Q25 5 25 -30" fill="none" stroke="#0B0B10" stroke-width="0.8"/>
    <path d="M25 -10 Q15 -16 8 -10" fill="#6FB07F" stroke="#0B0B10" stroke-width="0.8"/>
    <path d="M25 -10 Q35 -16 42 -10" fill="#6FB07F" stroke="#0B0B10" stroke-width="0.8"/>
  </g>
  <!-- Shipping container (small, on floor beside desk) -->
  <g transform="translate(660 380)">
    <polygon points="0,30 100,30 120,50 20,50" fill="#1C69D4" stroke="#0B0B10" stroke-width="1.2"/>
    <polygon points="0,30 100,30 120,50 20,50" fill="#0B0B10" opacity="0.1"/>
    <polygon points="0,30 100,30 100,38 0,38" fill="#0B0B10" opacity="0.3"/>
    <line x1="20" y1="30" x2="40" y2="50" stroke="#0B0B10" stroke-width="0.6" opacity="0.5"/>
    <line x1="40" y1="30" x2="60" y2="50" stroke="#0B0B10" stroke-width="0.6" opacity="0.5"/>
    <line x1="60" y1="30" x2="80" y2="50" stroke="#0B0B10" stroke-width="0.6" opacity="0.5"/>
    <line x1="80" y1="30" x2="100" y2="50" stroke="#0B0B10" stroke-width="0.6" opacity="0.5"/>
    <text x="60" y="44" font-family="Inter, sans-serif" font-size="7" font-weight="700" fill="#FFFFFF" text-anchor="middle">BAO</text>
  </g>
  <!-- Stack of books -->
  <g transform="translate(420 200)">
    <rect x="0" y="0" width="80" height="14" fill="#FF6F00" stroke="#0B0B10" stroke-width="0.8"/>
    <rect x="2" y="14" width="76" height="14" fill="#1C69D4" stroke="#0B0B10" stroke-width="0.8"/>
    <rect x="4" y="28" width="72" height="14" fill="#6FB07F" stroke="#0B0B10" stroke-width="0.8"/>
    <rect x="6" y="42" width="68" height="14" fill="#C9A24B" stroke="#0B0B10" stroke-width="0.8"/>
  </g>
  <!-- Pen -->
  <g transform="translate(360 200)">
    <rect x="0" y="0" width="40" height="4" fill="#0B0B10"/>
    <polygon points="40,0 50,2 40,4" fill="#C9A24B"/>
  </g>
</svg>
