<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="routeTitle">
  <title id="routeTitle">Trade route — Hong Kong to New York via Singapore, Suez, Rotterdam</title>
  <!-- Subtle background grid hint -->
  <g stroke="#1C69D4" stroke-width="0.5" opacity="0.08">
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
  </g>
  <!-- Trade route path -->
  <path d="M180 220 Q260 200 320 230 Q400 280 480 240 Q560 200 620 230 Q700 270 800 230 Q900 190 980 220 Q1060 250 1100 220" fill="none" stroke="#1C69D4" stroke-width="2.4" stroke-dasharray="8 6" stroke-linecap="round"/>
  <!-- Secondary route (return) -->
  <path d="M1100 220 Q1040 250 980 220 Q900 190 800 230 Q700 270 620 230 Q560 200 480 240 Q400 280 320 230 Q260 200 180 220" fill="none" stroke="#FF6F00" stroke-width="1.6" stroke-dasharray="4 6" stroke-linecap="round" opacity="0.7"/>

  <!-- City pins -->
  <g>
    <!-- Hong Kong -->
    <circle cx="180" cy="220" r="10" fill="#0B0B10"/>
    <circle cx="180" cy="220" r="5" fill="#C9A24B"/>
    <line x1="180" y1="210" x2="180" y2="180" stroke="#0B0B10" stroke-width="1.5"/>
    <rect x="140" y="160" width="80" height="22" rx="3" fill="#FFFFFF" stroke="#0B0B10" stroke-width="1.2"/>
    <text x="180" y="175" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0B0B10" text-anchor="middle">HONG KONG</text>
  </g>
  <g>
    <!-- Singapore -->
    <circle cx="320" cy="230" r="10" fill="#0B0B10"/>
    <circle cx="320" cy="230" r="5" fill="#C9A24B"/>
    <line x1="320" y1="220" x2="320" y2="280" stroke="#0B0B10" stroke-width="1.5"/>
    <rect x="280" y="282" width="80" height="22" rx="3" fill="#FFFFFF" stroke="#0B0B10" stroke-width="1.2"/>
    <text x="320" y="297" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0B0B10" text-anchor="middle">SINGAPORE</text>
  </g>
  <g>
    <!-- Suez -->
    <circle cx="620" cy="230" r="10" fill="#0B0B10"/>
    <circle cx="620" cy="230" r="5" fill="#C9A24B"/>
    <line x1="620" y1="220" x2="620" y2="180" stroke="#0B0B10" stroke-width="1.5"/>
    <rect x="580" y="160" width="80" height="22" rx="3" fill="#FFFFFF" stroke="#0B0B10" stroke-width="1.2"/>
    <text x="620" y="175" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0B0B10" text-anchor="middle">SUEZ</text>
  </g>
  <g>
    <!-- Rotterdam -->
    <circle cx="800" cy="230" r="10" fill="#0B0B10"/>
    <circle cx="800" cy="230" r="5" fill="#C9A24B"/>
    <line x1="800" y1="240" x2="800" y2="300" stroke="#0B0B10" stroke-width="1.5"/>
    <rect x="760" y="302" width="80" height="22" rx="3" fill="#FFFFFF" stroke="#0B0B10" stroke-width="1.2"/>
    <text x="800" y="317" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0B0B10" text-anchor="middle">ROTTERDAM</text>
  </g>
  <g>
    <!-- New York -->
    <circle cx="1100" cy="220" r="10" fill="#0B0B10"/>
    <circle cx="1100" cy="220" r="5" fill="#C9A24B"/>
    <line x1="1100" y1="210" x2="1100" y2="180" stroke="#0B0B10" stroke-width="1.5"/>
    <rect x="1050" y="160" width="100" height="22" rx="3" fill="#FFFFFF" stroke="#0B0B10" stroke-width="1.2"/>
    <text x="1100" y="175" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0B0B10" text-anchor="middle">NEW YORK</text>
  </g>

  <!-- Ship marker on route -->
  <g transform="translate(450 256)">
    <path d="M0 0 L14 0 L12 4 L2 4 Z" fill="#0B0B10"/>
    <rect x="3" y="-6" width="6" height="6" fill="#1C69D4"/>
    <line x1="6" y1="-6" x2="6" y2="-10" stroke="#0B0B10" stroke-width="1"/>
  </g>
  <!-- Compass -->
  <g transform="translate(80 80)">
    <circle cx="0" cy="0" r="22" fill="#FFFFFF" stroke="#0B0B10" stroke-width="1.4"/>
    <polygon points="0,-16 4,0 0,16 -4,0" fill="#0B0B10"/>
    <polygon points="0,-16 4,0 0,0" fill="#1C69D4"/>
    <text x="0" y="-26" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#0B0B10" text-anchor="middle">N</text>
  </g>
  <!-- Distance scale -->
  <g transform="translate(80 350)">
    <line x1="0" y1="0" x2="120" y2="0" stroke="#0B0B10" stroke-width="1.4"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#0B0B10" stroke-width="1.4"/>
    <line x1="60" y1="-3" x2="60" y2="3" stroke="#0B0B10" stroke-width="1.2"/>
    <line x1="120" y1="-4" x2="120" y2="4" stroke="#0B0B10" stroke-width="1.4"/>
    <text x="60" y="20" font-family="Inter, sans-serif" font-size="10" fill="#0B0B10" text-anchor="middle">~ 19,000 km</text>
  </g>
</svg>
