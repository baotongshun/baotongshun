<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="contactTitle">
  <title id="contactTitle">Contact illustration — isometric rooftop with satellite dish</title>
  <defs>
    <linearGradient id="skyContact" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C69D4" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#F6F5F1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#skyContact)"/>
  <!-- Clouds -->
  <g fill="#FFFFFF" opacity="0.7">
    <ellipse cx="120" cy="80" rx="40" ry="14"/>
    <ellipse cx="140" cy="74" rx="30" ry="12"/>
    <ellipse cx="640" cy="120" rx="50" ry="16"/>
    <ellipse cx="660" cy="114" rx="32" ry="12"/>
  </g>
  <!-- Sun glow -->
  <circle cx="660" cy="80" r="40" fill="#C9A24B" opacity="0.4"/>
  <circle cx="660" cy="80" r="20" fill="#C9A24B" opacity="0.7"/>
  <!-- Distant buildings (background) -->
  <g fill="#0B0B10" opacity="0.15">
    <rect x="0" y="280" width="60" height="120"/>
    <rect x="60" y="240" width="50" height="160"/>
    <rect x="110" y="270" width="70" height="130"/>
    <rect x="700" y="260" width="50" height="140"/>
    <rect x="750" y="280" width="50" height="120"/>
  </g>
  <!-- Main building (isometric) -->
  <g transform="translate(280 220)">
    <!-- Right face -->
    <polygon points="240,0 360,40 360,260 240,220" fill="#6B7280" stroke="#0B0B10" stroke-width="1.2"/>
    <!-- Front face -->
    <polygon points="0,40 240,0 240,220 0,260" fill="#8B95A3" stroke="#0B0B10" stroke-width="1.2"/>
    <!-- Roof -->
    <polygon points="0,40 240,0 360,40 120,80" fill="#5C6573" stroke="#0B0B10" stroke-width="1.2"/>
    <!-- Roof edge highlight -->
    <polygon points="0,40 240,0 240,4 0,44" fill="#0B0B10" opacity="0.3"/>
    <!-- Windows front -->
    <g fill="#1C69D4" opacity="0.6">
      <polygon points="20,80 50,76 50,116 20,120"/>
      <polygon points="80,76 110,72 110,112 80,116"/>
      <polygon points="140,72 170,68 170,108 140,112"/>
      <polygon points="20,150 50,146 50,186 20,190"/>
      <polygon points="80,146 110,142 110,182 80,186"/>
      <polygon points="140,142 170,138 170,178 140,182"/>
    </g>
    <!-- Window dividers -->
    <g fill="none" stroke="#0B0B10" stroke-width="0.8">
      <line x1="20" y1="100" x2="50" y2="96"/>
      <line x1="80" y1="96" x2="110" y2="92"/>
      <line x1="140" y1="92" x2="170" y2="88"/>
      <line x1="20" y1="170" x2="50" y2="166"/>
      <line x1="80" y1="166" x2="110" y2="162"/>
      <line x1="140" y1="162" x2="170" y2="158"/>
    </g>
    <!-- Windows right face -->
    <g fill="#1C69D4" opacity="0.5">
      <polygon points="260,76 290,84 290,124 260,116"/>
      <polygon points="300,80 330,88 330,128 300,120"/>
      <polygon points="260,146 290,154 290,194 260,186"/>
      <polygon points="300,150 330,158 330,198 300,190"/>
    </g>
    <!-- Door front -->
    <polygon points="190,180 220,176 220,260 190,260" fill="#0B0B10"/>
    <polygon points="194,184 216,181 216,256 194,256" fill="#C9A24B"/>
    <circle cx="212" cy="222" r="1.5" fill="#0B0B10"/>
  </g>
  <!-- Satellite dish on roof -->
  <g transform="translate(380 200)">
    <!-- Mount base -->
    <rect x="-4" y="0" width="8" height="20" fill="#0B0B10"/>
    <!-- Dish -->
    <ellipse cx="0" cy="-10" rx="40" ry="22" fill="#F6F5F1" stroke="#0B0B10" stroke-width="1.4"/>
    <ellipse cx="0" cy="-10" rx="36" ry="20" fill="#FFFFFF" stroke="#0B0B10" stroke-width="0.8"/>
    <ellipse cx="0" cy="-10" rx="24" ry="13" fill="#C9A24B" opacity="0.5"/>
    <line x1="-40" y1="-10" x2="40" y2="-10" stroke="#0B0B10" stroke-width="0.6" opacity="0.5"/>
    <line x1="-30" y1="-18" x2="30" y2="-2" stroke="#0B0B10" stroke-width="0.4" opacity="0.5"/>
    <line x1="-30" y1="-2" x2="30" y2="-18" stroke="#0B0B10" stroke-width="0.4" opacity="0.5"/>
    <!-- LNB feed -->
    <line x1="0" y1="-10" x2="0" y2="-32" stroke="#0B0B10" stroke-width="2"/>
    <rect x="-4" y="-38" width="8" height="8" fill="#0B0B10"/>
  </g>
  <!-- Antenna -->
  <g transform="translate(500 220)">
    <line x1="0" y1="0" x2="0" y2="-60" stroke="#0B0B10" stroke-width="2"/>
    <line x1="-8" y1="-30" x2="8" y2="-30" stroke="#0B0B10" stroke-width="1.5"/>
    <line x1="-6" y1="-40" x2="6" y2="-40" stroke="#0B0B10" stroke-width="1.5"/>
    <line x1="-4" y1="-50" x2="4" y2="-50" stroke="#0B0B10" stroke-width="1.5"/>
    <circle cx="0" cy="-60" r="3" fill="#FF6F00"/>
  </g>
  <!-- Signal waves from dish -->
  <g transform="translate(380 200)" fill="none" stroke="#1C69D4" stroke-width="1.4" opacity="0.7">
    <path d="M-50 -50 Q-30 -30 -50 -10" stroke-dasharray="2 3"/>
    <path d="M50 -50 Q30 -30 50 -10" stroke-dasharray="2 3"/>
    <path d="M-60 -60 Q-30 -30 -60 0" stroke-dasharray="2 3" opacity="0.5"/>
    <path d="M60 -60 Q30 -30 60 0" stroke-dasharray="2 3" opacity="0.5"/>
  </g>
  <!-- Speech / contact label -->
  <g transform="translate(80 340)">
    <rect x="0" y="0" width="180" height="44" rx="22" fill="#0B0B10"/>
    <circle cx="22" cy="22" r="10" fill="#C9A24B"/>
    <path d="M18 22 L21 25 L26 19" fill="none" stroke="#0B0B10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="42" y="20" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">CONTACT US</text>
    <text x="42" y="36" font-family="Inter, sans-serif" font-size="9" fill="#C9A24B">24/7 GLOBAL SUPPORT</text>
  </g>
</svg>
