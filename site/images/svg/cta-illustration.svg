<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ctaTitle">
  <title id="ctaTitle">Call to action illustration — Bao with Let's talk speech bubble and phone</title>
  <defs>
    <linearGradient id="bgCta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F5F1"/>
      <stop offset="1" stop-color="#E8E5DC"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgCta)"/>
  <!-- Decorative dots -->
  <g fill="#1C69D4" opacity="0.15">
    <circle cx="80" cy="80" r="4"/>
    <circle cx="120" cy="60" r="3"/>
    <circle cx="60" cy="120" r="3"/>
    <circle cx="700" cy="100" r="4"/>
    <circle cx="740" cy="60" r="3"/>
    <circle cx="720" cy="140" r="3"/>
  </g>
  <!-- Decorative ring -->
  <circle cx="640" cy="380" r="80" fill="none" stroke="#1C69D4" stroke-width="1.5" opacity="0.3"/>
  <circle cx="640" cy="380" r="120" fill="none" stroke="#1C69D4" stroke-width="1" opacity="0.2"/>
  <!-- Speech bubble -->
  <g transform="translate(120 80)">
    <path d="M20 20 Q20 0 40 0 L320 0 Q340 0 340 20 L340 120 Q340 140 320 140 L100 140 L70 180 L80 140 L40 140 Q20 140 20 120 Z" fill="#FFFFFF" stroke="#0B0B10" stroke-width="2"/>
    <text x="180" y="58" font-family="Inter, sans-serif" font-size="32" font-weight="800" fill="#0B0B10" text-anchor="middle">Let's talk</text>
    <text x="180" y="92" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#1C69D4" text-anchor="middle">baotongshun.com</text>
    <line x1="120" y1="108" x2="240" y2="108" stroke="#C9A24B" stroke-width="1.5"/>
    <text x="180" y="124" font-family="Inter, sans-serif" font-size="10" fill="#0B0B10" text-anchor="middle" opacity="0.7">HK BAOSHUN TRADE LIMITED</text>
  </g>
  <!-- Phone -->
  <g transform="translate(500 220)">
    <rect x="0" y="0" width="180" height="240" rx="22" fill="#0B0B10"/>
    <rect x="6" y="6" width="168" height="228" rx="18" fill="#FFFFFF"/>
    <rect x="14" y="20" width="152" height="200" rx="6" fill="#1C69D4"/>
    <rect x="80" y="14" width="20" height="4" rx="2" fill="#0B0B10"/>
    <rect x="74" y="228" width="32" height="4" rx="2" fill="#0B0B10"/>
    <!-- Phone screen content -->
    <text x="90" y="50" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">BAOSHUN</text>
    <line x1="30" y1="60" x2="150" y2="60" stroke="#FFFFFF" stroke-width="0.5" opacity="0.5"/>
    <!-- Chat bubbles -->
    <rect x="22" y="72" width="80" height="22" rx="11" fill="#FFFFFF"/>
    <text x="62" y="87" font-family="Inter, sans-serif" font-size="9" fill="#0B0B10" text-anchor="middle">Hello!</text>
    <rect x="78" y="100" width="80" height="22" rx="11" fill="#C9A24B"/>
    <text x="118" y="115" font-family="Inter, sans-serif" font-size="9" fill="#0B0B10" text-anchor="middle">Hi there 👋</text>
    <rect x="22" y="128" width="100" height="22" rx="11" fill="#FFFFFF"/>
    <text x="72" y="143" font-family="Inter, sans-serif" font-size="9" fill="#0B0B10" text-anchor="middle">Need a quote</text>
    <rect x="78" y="156" width="80" height="22" rx="11" fill="#C9A24B"/>
    <text x="118" y="171" font-family="Inter, sans-serif" font-size="9" fill="#0B0B10" text-anchor="middle">Let's chat 💬</text>
    <!-- Send button -->
    <circle cx="140" cy="200" r="10" fill="#C9A24B"/>
    <path d="M136 200 L144 200 M142 196 L146 200 L142 204" fill="none" stroke="#0B0B10" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <!-- Bao the otter -->
  <g transform="translate(80 290)">
    <!-- Shadow -->
    <ellipse cx="120" cy="200" rx="50" ry="5" fill="#0B0B10" opacity="0.1"/>
    <!-- Body -->
    <path d="M70 180 Q70 130 120 124 Q170 130 170 180 Q170 192 160 194 L80 194 Q70 192 70 180 Z" fill="#8B5E3C"/>
    <path d="M88 180 Q88 140 120 138 Q152 140 152 180 Q152 190 144 192 L96 192 Q88 190 88 180 Z" fill="#F4E4C1"/>
    <!-- Right arm (up, waving) -->
    <path d="M156 138 Q172 110 174 80 Q172 72 164 72 Q156 76 154 96 L150 124 Z" fill="#8B5E3C"/>
    <ellipse cx="166" cy="68" rx="12" ry="13" fill="#8B5E3C"/>
    <ellipse cx="166" cy="70" rx="7" ry="8" fill="#F4E4C1"/>
    <!-- Left arm (down) -->
    <path d="M84 144 Q70 164 72 184 Q78 192 86 188 Q90 172 92 158 Z" fill="#8B5E3C"/>
    <ellipse cx="80" cy="186" rx="9" ry="7" fill="#F4E4C1"/>
    <!-- Head -->
    <ellipse cx="120" cy="90" rx="56" ry="54" fill="#8B5E3C"/>
    <!-- Ears -->
    <circle cx="78" cy="50" r="11" fill="#8B5E3C"/>
    <circle cx="78" cy="50" r="6" fill="#F4E4C1"/>
    <circle cx="162" cy="50" r="11" fill="#8B5E3C"/>
    <circle cx="162" cy="50" r="6" fill="#F4E4C1"/>
    <!-- Face mask -->
    <ellipse cx="120" cy="100" rx="40" ry="36" fill="#F4E4C1"/>
    <!-- Eyes (happy closed) -->
    <path d="M94 92 Q102 84 110 92" fill="none" stroke="#0B0B10" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M130 92 Q138 84 146 92" fill="none" stroke="#0B0B10" stroke-width="2.4" stroke-linecap="round"/>
    <!-- Cheek blush -->
    <ellipse cx="86" cy="112" rx="7" ry="4" fill="#FF6F00" opacity="0.25"/>
    <ellipse cx="154" cy="112" rx="7" ry="4" fill="#FF6F00" opacity="0.25"/>
    <!-- Nose -->
    <path d="M114 108 Q120 102 126 108 Q124 114 120 114 Q116 114 114 108 Z" fill="#0B0B10"/>
    <!-- Mouth -->
    <path d="M120 114 L120 120" stroke="#0B0B10" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M120 120 Q112 126 108 122" fill="none" stroke="#0B0B10" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M120 120 Q128 126 132 122" fill="none" stroke="#0B0B10" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Whiskers -->
    <line x1="98" y1="112" x2="78" y2="110" stroke="#5C3A20" stroke-width="0.9" stroke-linecap="round"/>
    <line x1="98" y1="116" x2="78" y2="118" stroke="#5C3A20" stroke-width="0.9" stroke-linecap="round"/>
    <line x1="142" y1="112" x2="162" y2="110" stroke="#5C3A20" stroke-width="0.9" stroke-linecap="round"/>
    <line x1="142" y1="116" x2="162" y2="118" stroke="#5C3A20" stroke-width="0.9" stroke-linecap="round"/>
  </g>
  <!-- Sparkles -->
  <g fill="#C9A24B">
    <path d="M380 120 L384 128 L392 130 L384 132 L380 140 L376 132 L368 130 L376 128 Z"/>
    <path d="M500 60 L502 66 L508 68 L502 70 L500 76 L498 70 L492 68 L498 66 Z"/>
    <path d="M620 200 L622 206 L628 208 L622 210 L620 216 L618 210 L612 208 L618 206 Z"/>
  </g>
</svg>
