    <rect x="20" y="6" width="40" height="20" fill="#FF6F00"/>
    <rect x="62" y="6" width="40" height="20" fill="#1C69D4"/>
    <rect x="104" y="6" width="40" height="20" fill="#6FB07F"/>
    <rect x="146" y="6" width="40" height="20" fill="#C9A24B"/>
    <rect x="188" y="6" width="40" height="20" fill="#1C69D4"/>
    <rect x="20" y="22" width="40" height="6" fill="#0B0B10" opacity="0.5"/>
    <rect x="62" y="22" width="40" height="6" fill="#0B0B10" opacity="0.5"/>
  </g>
  <!-- Trade route curve in sky -->
  <path d="M180 460 Q400 380 600 420 Q800 460 1100 380" fill="none" stroke="#C9A24B" stroke-width="2" stroke-dasharray="6 5" opacity="0.8"/>
  <circle cx="180" cy="460" r="5" fill="#C9A24B"/>
  <circle cx="600" cy="420" r="5" fill="#C9A24B"/>
  <circle cx="1100" cy="380" r="5" fill="#C9A24B"/>
  <!-- Small plane -->
  <g transform="translate(820 410)">
    <path d="M0 0 L20 -2 L24 0 L20 2 L8 4 L4 8 L0 4 Z" fill="#FFFFFF" opacity="0.85"/>
  </g>
</svg>
