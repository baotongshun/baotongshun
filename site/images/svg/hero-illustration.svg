<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Hero illustration — global trade</title>
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0B10"/>
      <stop offset="0.6" stop-color="#1C1A2E"/>
      <stop offset="1" stop-color="#1C69D4" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#1C69D4" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#1C69D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C9A24B" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#C9A24B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waterGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C69D4" stop-opacity="0"/>
      <stop offset="1" stop-color="#1C69D4" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <!-- Sky background -->
  <rect width="1600" height="900" fill="url(#skyGrad)"/>
  <!-- Soft glows -->
  <ellipse cx="900" cy="350" rx="700" ry="500" fill="url(#glowGrad)"/>
  <ellipse cx="400" cy="200" rx="400" ry="300" fill="url(#warmGlow)"/>
  <!-- Stars -->
  <g fill="#FFFFFF" opacity="0.6">
    <circle cx="120" cy="80" r="1.2"/>
    <circle cx="320" cy="120" r="0.8"/>
    <circle cx="540" cy="60" r="1.4"/>
    <circle cx="780" cy="140" r="0.9"/>
    <circle cx="1100" cy="100" r="1.1"/>
    <circle cx="1340" cy="60" r="0.8"/>
    <circle cx="1480" cy="180" r="1.3"/>
    <circle cx="200" cy="220" r="0.7"/>
    <circle cx="640" cy="200" r="0.9"/>
    <circle cx="1240" cy="240" r="0.8"/>
  </g>
  <!-- Giant tilted globe -->
  <g transform="translate(1100 380) rotate(-18)">
    <ellipse cx="0" cy="0" rx="380" ry="380" fill="#0B0B10" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="370" ry="370" fill="none" stroke="#1C69D4" stroke-width="2" opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="370" ry="370" fill="#1C69D4" opacity="0.06"/>
    <ellipse cx="0" cy="0" rx="280" ry="370" fill="none" stroke="#1C69D4" stroke-width="1.2" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="180" ry="370" fill="none" stroke="#1C69D4" stroke-width="1" opacity="0.4"/>
    <ellipse cx="0" cy="0" rx="80" ry="370" fill="none" stroke="#1C69D4" stroke-width="1" opacity="0.4"/>
    <line x1="-370" y1="0" x2="370" y2="0" stroke="#1C69D4" stroke-width="1" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="370" ry="120" fill="none" stroke="#1C69D4" stroke-width="1" opacity="0.4"/>
    <ellipse cx="0" cy="0" rx="370" ry="240" fill="none" stroke="#1C69D4" stroke-width="1" opacity="0.4"/>
    <!-- Continent hints -->
    <path d="M-200 -80 Q-100 -120 0 -90 Q100 -100 180 -60 Q160 0 80 20 Q-20 30 -100 0 Q-180 -10 -200 -80 Z" fill="#1C69D4" opacity="0.18"/>
    <path d="M40 80 Q120 60 160 120 Q140 180 100 220 Q60 200 40 160 Z" fill="#1C69D4" opacity="0.15"/>
    <path d="M-200 100 Q-160 80 -120 130 Q-100 200 -130 250 Q-180 240 -200 180 Z" fill="#1C69D4" opacity="0.15"/>
    <!-- Gold meridian arc -->
    <path d="M370 0 A370 370 0 0 1 0 370" fill="none" stroke="#C9A24B" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <!-- Skyline silhouette -->
  <g fill="#0B0B10">
    <rect x="0" y="700" width="80" height="100"/>
    <rect x="80" y="660" width="60" height="140"/>
    <rect x="140" y="620" width="80" height="180"/>
    <rect x="220" y="680" width="60" height="120"/>
    <rect x="280" y="640" width="70" height="160"/>
    <rect x="350" y="700" width="50" height="100"/>
    <rect x="400" y="600" width="80" height="200"/>
    <rect x="480" y="660" width="60" height="140"/>
    <rect x="540" y="700" width="50" height="100"/>
    <rect x="590" y="630" width="80" height="170"/>
    <rect x="670" y="680" width="50" height="120"/>
    <rect x="720" y="650" width="70" height="150"/>
    <rect x="790" y="700" width="50" height="100"/>
    <rect x="840" y="640" width="80" height="160"/>
    <rect x="920" y="690" width="50" height="110"/>
    <rect x="970" y="660" width="70" height="140"/>
    <rect x="1040" y="700" width="50" height="100"/>
    <rect x="1090" y="620" width="80" height="180"/>
    <rect x="1170" y="680" width="60" height="120"/>
    <rect x="1230" y="700" width="50" height="100"/>
    <rect x="1280" y="660" width="70" height="140"/>
    <rect x="1350" y="700" width="50" height="100"/>
    <rect x="1400" y="640" width="80" height="160"/>
    <rect x="1480" y="690" width="50" height="110"/>
    <rect x="1530" y="700" width="70" height="100"/>
  </g>
