  <g fill="#C9A24B" opacity="0.5">
    <rect x="100" y="700" width="6" height="6"/>
    <rect x="120" y="700" width="6" height="6"/>
    <rect x="100" y="720" width="6" height="6"/>
    <rect x="120" y="720" width="6" height="6"/>
    <rect x="100" y="740" width="6" height="6"/>
    <rect x="120" y="740" width="6" height="6"/>
    <rect x="160" y="660" width="6" height="6"/>
    <rect x="180" y="660" width="6" height="6"/>
    <rect x="200" y="660" width="6" height="6"/>
    <rect x="160" y="680" width="6" height="6"/>
    <rect x="180" y="680" width="6" height="6"/>
    <rect x="200" y="680" width="6" height="6"/>
    <rect x="160" y="700" width="6" height="6"/>
    <rect x="180" y="700" width="6" height="6"/>
    <rect x="200" y="700" width="6" height="6"/>
    <rect x="160" y="720" width="6" height="6"/>
    <rect x="180" y="720" width="6" height="6"/>
    <rect x="200" y="720" width="6" height="6"/>
    <rect x="430" y="640" width="6" height="6"/>
    <rect x="450" y="640" width="6" height="6"/>
    <rect x="430" y="660" width="6" height="6"/>
    <rect x="450" y="660" width="6" height="6"/>
    <rect x="430" y="680" width="6" height="6"/>
    <rect x="450" y="680" width="6" height="6"/>
    <rect x="430" y="700" width="6" height="6"/>
    <rect x="450" y="700" width="6" height="6"/>
    <rect x="1110" y="660" width="6" height="6"/>
    <rect x="1130" y="660" width="6" height="6"/>
    <rect x="1150" y="660" width="6" height="6"/>
    <rect x="1110" y="680" width="6" height="6"/>
    <rect x="1130" y="680" width="6" height="6"/>
    <rect x="1150" y="680" width="6" height="6"/>
    <rect x="1110" y="700" width="6" height="6"/>
    <rect x="1130" y="700" width="6" height="6"/>
    <rect x="1150" y="700" width="6" height="6"/>
  </g>
  <!-- Water -->
  <rect x="0" y="800" width="1600" height="100" fill="url(#waterGrad2)"/>
  <g stroke="#1C69D4" stroke-width="1.4" fill="none" opacity="0.5">
    <path d="M0 830 Q100 826 200 830 T400 830 T600 830 T800 830 T1000 830 T1200 830 T1400 830 T1600 830"/>
    <path d="M0 860 Q100 856 200 860 T400 860 T600 860 T800 860 T1000 860 T1200 860 T1400 860 T1600 860"/>
  </g>
  <!-- Container ship on water -->
  <g transform="translate(220 770)">
    <path d="M0 30 L260 30 L246 50 L14 50 Z" fill="#0B0B10"/>
    <path d="M14 30 L246 30 L240 38 L20 38 Z" fill="#1C69D4"/>
    <rect x="230" y="14" width="14" height="16" fill="#0B0B10"/>
    <rect x="234" y="6" width="8" height="8" fill="#0B0B10"/>
