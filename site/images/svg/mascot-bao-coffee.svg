<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="baoCoffeeTitle">
  <title id="baoCoffeeTitle">Bao the otter with coffee</title>
  <!-- Background -->
  <rect width="240" height="240" fill="#FFFFFF"/>
  <!-- Steam wisps -->
  <path d="M100 30 Q96 40 100 50 Q104 60 100 72" fill="none" stroke="#1C69D4" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M120 22 Q116 32 120 42 Q124 52 120 64" fill="none" stroke="#1C69D4" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M140 30 Q136 40 140 50 Q144 60 140 72" fill="none" stroke="#1C69D4" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- Shadow -->
  <ellipse cx="120" cy="220" rx="60" ry="5" fill="#0B0B10" opacity="0.08"/>
  <!-- Body -->
  <path d="M70 200 Q70 144 120 138 Q170 144 170 200 Q170 210 160 212 L80 212 Q70 210 70 200 Z" fill="#8B5E3C"/>
  <!-- Belly -->
  <path d="M90 200 Q90 158 120 156 Q150 158 150 200 Q150 208 142 210 L98 210 Q90 208 90 200 Z" fill="#F4E4C1"/>
  <!-- Both arms holding cup -->
  <path d="M80 162 Q72 178 80 192 Q92 198 100 188 Q102 178 98 168 Z" fill="#8B5E3C"/>
  <path d="M160 162 Q168 178 160 192 Q148 198 140 188 Q138 178 142 168 Z" fill="#8B5E3C"/>
  <!-- Coffee cup -->
  <g transform="translate(94 162)">
    <path d="M0 16 L4 52 Q6 56 10 56 L42 56 Q46 56 48 52 L52 16 Z" fill="#FFFFFF" stroke="#0B0B10" stroke-width="1.6"/>
    <ellipse cx="26" cy="16" rx="26" ry="5" fill="#5C3A20"/>
    <ellipse cx="26" cy="16" rx="22" ry="3" fill="#3A2412"/>
    <path d="M48 24 Q60 26 60 36 Q60 46 48 46" fill="none" stroke="#0B0B10" stroke-width="1.6"/>
    <rect x="6" y="22" width="40" height="3" fill="#C9A24B" opacity="0.8"/>
    <rect x="6" y="36" width="40" height="2" fill="#0B0B10" opacity="0.4"/>
    <path d="M16 28 L18 32 L22 32 L19 35 L20 39 L16 37 L12 39 L13 35 L10 32 L14 32 Z" fill="#C9A24B"/>
  </g>
  <!-- Paws on cup -->
  <ellipse cx="86" cy="186" rx="9" ry="7" fill="#F4E4C1"/>
  <ellipse cx="154" cy="186" rx="9" ry="7" fill="#F4E4C1"/>
  <circle cx="83" cy="184" r="1.2" fill="#5C3A20"/>
  <circle cx="89" cy="184" r="1.2" fill="#5C3A20"/>
  <circle cx="86" cy="188" r="1.2" fill="#5C3A20"/>
  <circle cx="151" cy="184" r="1.2" fill="#5C3A20"/>
  <circle cx="157" cy="184" r="1.2" fill="#5C3A20"/>
  <circle cx="154" cy="188" r="1.2" fill="#5C3A20"/>
  <!-- Head -->
  <ellipse cx="120" cy="98" rx="58" ry="56" fill="#8B5E3C"/>
  <!-- Ears -->
  <circle cx="76" cy="56" r="11" fill="#8B5E3C"/>
  <circle cx="76" cy="56" r="6" fill="#F4E4C1"/>
  <circle cx="164" cy="56" r="11" fill="#8B5E3C"/>
  <circle cx="164" cy="56" r="6" fill="#F4E4C1"/>
  <!-- Face mask -->
  <ellipse cx="120" cy="108" rx="40" ry="36" fill="#F4E4C1"/>
  <!-- Eyes (blissful closed) -->
  <path d="M92 100 Q100 92 108 100" fill="none" stroke="#0B0B10" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M132 100 Q140 92 148 100" fill="none" stroke="#0B0B10" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Cheek blush -->
  <ellipse cx="86" cy="120" rx="7" ry="4" fill="#FF6F00" opacity="0.25"/>
  <ellipse cx="154" cy="120" rx="7" ry="4" fill="#FF6F00" opacity="0.25"/>
  <!-- Nose -->
  <path d="M114 116 Q120 110 126 116 Q124 122 120 122 Q116 122 114 116 Z" fill="#0B0B10"/>
  <!-- Mouth (smile) -->
  <path d="M120 122 L120 128" stroke="#0B0B10" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M120 128 Q112 134 108 130" fill="none" stroke="#0B0B10" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M120 128 Q128 134 132 130" fill="none" stroke="#0B0B10" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Whiskers -->
  <line x1="98" y1="120" x2="78" y2="118" stroke="#5C3A20" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="98" y1="124" x2="78" y2="126" stroke="#5C3A20" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="142" y1="120" x2="162" y2="118" stroke="#5C3A20" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="142" y1="124" x2="162" y2="126" stroke="#5C3A20" stroke-width="0.9" stroke-linecap="round"/>
</svg>
